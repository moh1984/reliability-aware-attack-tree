<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 525" width="940" height="525" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .root{fill:#1F4E78;} .gate{fill:#2E75B6;} .leaf{fill:#DEEAF6;stroke:#2E75B6;stroke-width:1.6;}
  .blocked{fill:#F8CBAD;stroke:#C55A11;stroke-width:1.6;} .passes{fill:#C6E0B4;stroke:#548235;stroke-width:2;}
  .wlbl{font-size:16px;fill:#fff;font-weight:bold;}
  .lbl{font-size:15px;fill:#1A1A1A;}
  .dtag{font-size:13px;font-weight:bold;}
  .cap{font-size:12px;fill:#555;font-style:italic;}
  .edge{stroke:#8A8A8A;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .gatetag{font-size:12.5px;font-weight:bold;}
</style>

<!-- ================= ROOT ================= -->
<rect class="root" x="320" y="14" width="300" height="50" rx="7"/>
<text class="wlbl" x="470" y="36" text-anchor="middle">ROOT GOAL</text>
<text class="wlbl" x="470" y="55" text-anchor="middle" font-size="13">Unauthorized action on application</text>

<!-- top-level OR -->
<rect class="gate" x="420" y="88" width="100" height="30" rx="7"/>
<text class="wlbl" x="470" y="110" text-anchor="middle">OR</text>
<path class="edge" d="M470,64 L470,88"/>

<!-- ================= LEVEL 2 ================= -->
<!-- A: injection OR -->
<rect class="gate" x="85" y="150" width="160" height="32" rx="7"/>
<text class="wlbl" x="165" y="173" text-anchor="middle">OR (injection)</text>
<path class="edge" d="M430,118 Q280,134 165,150"/>

<!-- B: CSRF leaf -->
<rect class="passes" x="355" y="146" width="150" height="48" rx="6"/>
<text class="lbl" x="430" y="167" text-anchor="middle">CSRF (CWE-352)</text>
<text class="dtag" x="430" y="186" text-anchor="middle" fill="#548235">d = 1.00 (passes)</text>
<path class="edge" d="M465,118 L430,146"/>

<!-- C: SAND -->
<rect class="gate" x="600" y="150" width="280" height="32" rx="7"/>
<text class="wlbl" x="668" y="173" text-anchor="middle">SAND</text>
<text class="gatetag" x="782" y="173" text-anchor="middle" fill="#DCE9F7">(sequential)</text>
<path class="edge" d="M510,118 Q640,134 740,150"/>

<!-- ================= INJECTION LEAVES ================= -->
<path class="edge" d="M165,182 L165,213"/>
<path class="edge" d="M165,213 L80,226"/>
<path class="edge" d="M165,213 L250,226"/>
<path class="edge" d="M165,213 L165,279"/>
<path class="edge" d="M165,279 L80,292"/>
<path class="edge" d="M165,279 L250,292"/>

<rect class="blocked" x="10" y="226" width="140" height="50" rx="6"/>
<text class="lbl" x="80" y="247" text-anchor="middle">SQL Injection</text>
<text class="dtag" x="80" y="266" text-anchor="middle" fill="#C55A11">d = 0.00</text>

<rect class="blocked" x="180" y="226" width="140" height="50" rx="6"/>
<text class="lbl" x="250" y="247" text-anchor="middle">Reflected XSS</text>
<text class="dtag" x="250" y="266" text-anchor="middle" fill="#C55A11">d = 0.00</text>

<rect class="passes" x="10" y="292" width="140" height="50" rx="6"/>
<text class="lbl" x="80" y="313" text-anchor="middle">Command Inj.</text>
<text class="dtag" x="80" y="332" text-anchor="middle" fill="#548235">d = 0.50</text>

<rect class="blocked" x="180" y="292" width="140" height="50" rx="6"/>
<text class="lbl" x="250" y="313" text-anchor="middle">File Inclusion</text>
<text class="dtag" x="250" y="332" text-anchor="middle" fill="#C55A11">d = 0.00</text>

<!-- ================= SAND SUBTREE ================= -->
<rect class="gate" x="545" y="226" width="240" height="30" rx="7"/>
<text class="wlbl" x="665" y="248" text-anchor="middle">OR (payload persisted)</text>
<path class="edge" d="M680,182 L665,226"/>

<rect class="leaf" x="800" y="222" width="130" height="50" rx="6"/>
<text class="lbl" x="865" y="243" text-anchor="middle">Admin renders</text>
<text class="cap" x="865" y="261" text-anchor="middle">page (victim step)</text>
<path class="edge" d="M820,182 L865,222"/>

<rect class="blocked" x="525" y="296" width="170" height="58" rx="6"/>
<text class="lbl" x="610" y="317" text-anchor="middle">Direct store</text>
<text class="dtag" x="610" y="334" text-anchor="middle" fill="#C55A11">d = 0.00 blocked@store</text>
<text class="cap" x="610" y="348" text-anchor="middle">(403 at write)</text>

<rect class="passes" x="710" y="296" width="180" height="58" rx="6"/>
<text class="lbl" x="800" y="317" text-anchor="middle">Off-path store</text>
<text class="dtag" x="800" y="334" text-anchor="middle" fill="#548235">d = 1.00 served@render</text>
<text class="cap" x="800" y="348" text-anchor="middle">(not blocked outbound)</text>

<path class="edge" d="M600,256 L610,296"/>
<path class="edge" d="M730,256 L800,296"/>

<!-- ================= LEGEND ================= -->
<rect x="205" y="380" width="530" height="132" rx="7" fill="#F7F7F7" stroke="#CCCCCC"/>
<text x="470" y="403" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F4E78">Measured defense factor d (DVWA calibration)</text>

<rect class="passes" x="227" y="416" width="24" height="17"/>
<text class="lbl" x="259" y="429">d = 1.00 : attack passes the WAF (no signature / not blocked outbound)</text>

<rect class="blocked" x="227" y="442" width="24" height="17"/>
<text class="lbl" x="259" y="455">d = 0.00 : attack blocked (injection signature in an inspected request)</text>

<rect class="passes" x="227" y="468" width="24" height="17"/>
<text class="lbl" x="259" y="481">d = 0.50 : partial — id passes; echo blocked</text>

<text class="cap" x="470" y="502" text-anchor="middle">Gate logic: OR = any child suffices; SAND = children in sequence (store, then render).</text>
</svg>
